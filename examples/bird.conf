# BIRD example for pve-routedip: announce the routed IPs of running VMs to
# upstream BGP routers.
#
# pve-routedip installs a route (kernel protocol 150, "routedip") for every
# routed IP on the node the VM runs on and moves it along on live migration.
# With this configuration on every node, each node announces exactly the VMs
# it currently hosts.
#
# Works with BIRD 2 (bird2) and BIRD 3 (bird3):
#
#   apt install bird2
#   cp /usr/share/doc/pve-routedip/examples/bird.conf /etc/bird/bird.conf
#   # adapt everything marked ADAPT
#   systemctl restart bird
#   birdc show route export upstream4

# ADAPT: unique per node, here taken from the address of the node's vmbr0
router id from "vmbr0";

log syslog all;

# kernel protocol number of the routes pve-routedip installs
define ROUTEDIP = 150;

# ADAPT: the address space routed to VMs; nothing outside of it is announced,
# even if someone configures it as a routed IP
define ROUTED_V4 = [ 203.0.113.0/24+, 198.51.100.0/24+ ];
define ROUTED_V6 = [ 2001:db8::/32+ ];

# ADAPT: own AS and the AS of the upstream routers
define LOCAL_AS = 65010;
define UPSTREAM_AS = 65000;

protocol device {
}

# Learn the pve-routedip routes from the kernel main table. 'learn' is needed,
# without it BIRD ignores routes it did not create itself.
#
# 'export none': never write routes to the kernel. A BGP route for a routed
# prefix (e.g. announced by the node that hosted the VM before) would compete
# with the route pve-routedip installs for the VM on this node.
protocol kernel routedip4 {
    learn;
    ipv4 {
        import where krt_source = ROUTEDIP;
        export none;
    };
}

protocol kernel routedip6 {
    learn;
    ipv6 {
        import where krt_source = ROUTEDIP;
        export none;
    };
}

filter export_routedip4 {
    if proto = "routedip4" && net ~ ROUTED_V4 then accept;
    reject;
}

filter export_routedip6 {
    if proto = "routedip6" && net ~ ROUTED_V6 then accept;
    reject;
}

# The routes point to tap devices or bridges, so the next hop announced is
# always the node itself.
protocol bgp upstream4 {
    local as LOCAL_AS;
    neighbor 192.0.2.1 as UPSTREAM_AS;        # ADAPT
    ipv4 {
        import none;
        export filter export_routedip4;
        next hop self;
    };
}

protocol bgp upstream6 {
    local as LOCAL_AS;
    neighbor 2001:db8:ffff::1 as UPSTREAM_AS; # ADAPT
    ipv6 {
        import none;
        export filter export_routedip6;
        next hop self;
    };
}
